<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Southeastern NC Cams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
  </head>
  <body>
    <main class="container mt-4">
      <h1 class="mb-3">Southeastern NC Cams</h1>
      <p class="text-muted">List of cams for Southeastern North Carolina. Hover or open a cam to visit provider page; add `embed_url` in <code>data/cameras.json</code> to enable inline playback.</p>

      <div id="cams" class="row g-3"></div>
    </main>

    <template id="cam-card">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <img class="card-img-top preview" src="https://via.placeholder.com/640x360?text=Cam+Preview" alt="cam preview">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title name"></h5>
            <p class="card-text small text-muted city"></p>
            <p class="card-text provider"></p>
            <div class="mt-auto d-flex gap-2">
              <a class="btn btn-primary btn-sm view-btn" target="_blank">Open</a>
              <button class="btn btn-outline-secondary btn-sm details-btn" type="button">Details</button>
            </div>
          </div>
        </div>
      </div>
    </template>

    <div class="modal fade" id="camModal" tabindex="-1">
      <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="camModalTitle">Cam</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="camModalBody">
            <p class="text-muted">No inline stream available. Click "Open" to visit provider page.</p>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      async function loadCams() {
        const res = await fetch('/api/cameras');
        const cams = await res.json();
        const container = document.getElementById('cams');
        const template = document.getElementById('cam-card');

        cams.forEach(cam => {
          const node = template.content.cloneNode(true);
          node.querySelector('.name').textContent = cam.name;
          node.querySelector('.city').textContent = cam.city;
          node.querySelector('.provider').textContent = 'Provider: ' + (cam.provider || 'unknown');
          const img = node.querySelector('.preview');
          // Use provider preview if possible
          if (cam.provider && cam.provider.toLowerCase().includes('surfline')) {
            // Best-effort preview path (may require updating with real slug)
            img.src = `https://camstills.cdn-surfline.com/us-east-1/${cam.id}/latest_small.jpg`;
          }

          // If a source URL exists (e.g. Surfchex), show it under the provider
          if (cam.source_url) {
            const sourceEl = document.createElement('p');
            sourceEl.className = 'card-text small text-muted';
            sourceEl.innerHTML = `Source: <a href="${cam.source_url}" target="_blank">Surfchex</a>`;
            node.querySelector('.card-body').insertBefore(sourceEl, node.querySelector('.mt-auto'));
          }

          const openBtn = node.querySelector('.view-btn');
          openBtn.href = cam.website_url || '#';
          openBtn.textContent = cam.embed_url ? 'Play' : 'Open';

          if (cam.embed_url) {
            openBtn.addEventListener('click', (e) => {
              e.preventDefault();
              showModal(cam);
            });
          }

          node.querySelector('.details-btn').addEventListener('click', () => showModal(cam));

          container.appendChild(node);
        });
      }

      function showModal(cam) {
        const title = document.getElementById('camModalTitle');
        const body = document.getElementById('camModalBody');
        title.textContent = cam.name + ' — ' + cam.city;
        body.innerHTML = '';

        if (cam.embed_url) {
          // choose iframe or video tag depending on content
          if (cam.embed_url.endsWith('.m3u8') || cam.embed_url.match(/https?:\/\/.*\.m3u8/)) {
            body.innerHTML = `<video controls class="w-100" autoplay>
              <source src="${cam.embed_url}" type="application/x-mpegURL">
              Your browser does not support this video format.
            </video>`;
          } else if (cam.embed_url.startsWith('http')) {
            body.innerHTML = `<iframe src="${cam.embed_url}" style="width:100%;height:60vh;border:0"></iframe>`;
          }
        } else if (cam.website_url) {
          body.innerHTML = `<p>Inline stream not configured. <a href="${cam.website_url}" target="_blank">Open provider page</a>.</p>`;
        } else {
          body.innerHTML = `<p>No stream or provider page configured. Edit <code>data/cameras.json</code> to add one.</p>`;
        }

        if (cam.source_url) {
          body.innerHTML += `<p class="mt-2 small text-muted">Source: <a href="${cam.source_url}" target="_blank">Surfchex</a></p>`;
        }

        const modalEl = document.getElementById('camModal');
        const bsModal = new bootstrap.Modal(modalEl);
        bsModal.show();
      }

      loadCams().catch(err => console.error(err));
    </script>
  </body>
</html>
