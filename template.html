<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Surf Cam template</title>
    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container mt-4">
    <div class="row">
      <div class="col-md-8">
        <div id="title_bg" class="mb-3">
            <h1 id="title"><b>Lowers</b></h1>
        </div>
        <video
          class="video-js w-100 mx-auto rounded vjs-16-9"
          controls
          preload="auto"
          data-setup="{}"
          poster="https://camstills.cdn-surfline.com/us-west-2/wc-lowers/latest_small.jpg">
          <source type="application/x-mpegURL" src="https://cams.cdn-surfline.com/cdn-wc/wc-lowers/playlist.m3u8">
        </video>
      </div>

      <div class="col-md-4">
        <section class="card p-3">
          <h2 class="h5 mb-3">Tasks</h2>

          <div class="btn-group mb-3 w-100" role="group" aria-label="Task filters">
            <button id="filter-all" class="btn btn-outline-primary">All</button>
            <button id="filter-completed" class="btn btn-outline-success">Completed</button>
            <button id="filter-pending" class="btn btn-outline-warning">Pending</button>
          </div>

          <ul id="task-list" class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center" data-status="completed">
              <span>Check camera stream</span>
              <span class="badge bg-success">Completed</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center" data-status="pending">
              <span>Update cameras.json with Carolina Beach cams</span>
              <span class="badge bg-warning text-dark">Pending</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center" data-status="completed">
              <span>Add tracing instrumentation</span>
              <span class="badge bg-success">Completed</span>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center" data-status="pending">
              <span>Integrate LLM orchestration</span>
              <span class="badge bg-warning text-dark">Pending</span>
            </li>
          </ul>

          <div class="mt-3 text-muted small">Use the buttons above to filter tasks. Styling follows the existing Bootstrap/water.css design.</div>
        </section>
      </div>
    </div>
  </div>

  <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
  <script>
    (function() {
      const list = document.getElementById('task-list');
      const btnAll = document.getElementById('filter-all');
      const btnCompleted = document.getElementById('filter-completed');
      const btnPending = document.getElementById('filter-pending');

      function setActive(button) {
        [btnAll, btnCompleted, btnPending].forEach(b => b.classList.remove('active'));
        button.classList.add('active');
      }

      function filterTasks(status) {
        const items = list.querySelectorAll('li[data-status]');
        items.forEach(item => {
          if (status === 'all') {
            item.style.display = '';
          } else {
            item.style.display = (item.getAttribute('data-status') === status) ? '' : 'none';
          }
        });
      }

      btnAll.addEventListener('click', () => { setActive(btnAll); filterTasks('all'); });
      btnCompleted.addEventListener('click', () => { setActive(btnCompleted); filterTasks('completed'); });
      btnPending.addEventListener('click', () => { setActive(btnPending); filterTasks('pending'); });

      // Initialize - show all
      setActive(btnAll);
      filterTasks('all');
    })();
  </script>
</body>
</html>
